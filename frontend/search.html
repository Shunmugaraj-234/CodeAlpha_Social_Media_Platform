<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover & Search — PULSE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="top-navbar">
    <div class="brand-logo">
      <div class="pulse-dot"></div>
      <a href="home.html" class="gradient-text">PULSE</a>
    </div>

    <div class="nav-actions">
      <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">☀️</button>
      <a href="home.html" class="btn btn-secondary btn-sm">Home</a>
    </div>
  </header>

  <div style="max-width:1100px; margin:28px auto; padding:0 20px; display:flex; flex-direction:column; gap:24px;">
    <!-- Search Bar Input Card -->
    <div class="glass-panel" style="padding:20px;">
      <div style="position:relative;">
        <input type="text" id="search-input" class="input-field" placeholder="Search people, topics, #hashtags, or communities..." style="padding-left:45px; font-size:1.05rem;" autofocus />
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:1.2rem; color:var(--text-muted);">🔎</span>
      </div>
    </div>

    <!-- Results / Recommendations Viewport -->
    <div id="search-results-container">
      <div class="skeleton" style="height:200px;"></div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="home.html" class="mobile-nav-item"><span>🏠</span> Home</a>
    <a href="search.html" class="mobile-nav-item active"><span>🔎</span> Search</a>
    <a href="home.html#create" class="mobile-nav-item"><span>➕</span> Create</a>
    <a href="activity.html" class="mobile-nav-item"><span>🔔</span> Activity</a>
    <a href="profile.html" class="mobile-nav-item"><span>👤</span> Profile</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
