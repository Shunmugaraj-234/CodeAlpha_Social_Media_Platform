<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PULSE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container glass-panel">
    <div class="auth-header">
      <div class="brand-logo" style="justify-content:center; margin-bottom:12px;">
        <div class="pulse-dot"></div>
        <span class="gradient-text">PULSE</span>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to access your smart feed and digital community</p>
    </div>

    <form class="auth-form" id="login-form">
      <div class="form-group">
        <label for="login-email">Email or Username</label>
        <input type="text" id="login-email" class="input-field" placeholder="alex@pulse.dev or alexrivers" required />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="input-field" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top:10px; width:100%;">Sign In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="register.html">Join Pulse</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
