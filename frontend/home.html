<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard — PULSE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="top-navbar">
    <div class="brand-logo">
      <div class="pulse-dot"></div>
      <a href="home.html" class="gradient-text">PULSE</a>
    </div>

    <div style="flex:1; max-width:400px; margin:0 20px;">
      <input type="text" class="input-field" placeholder="Search people, topics, or #hashtags..." onclick="window.location.href='search.html'" style="padding:8px 16px; font-size:0.88rem;" />
    </div>

    <div class="nav-actions">
      <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">☀️</button>
      <a href="activity.html" class="btn-icon" title="Notifications">🔔</a>
      <a href="#" class="logout-btn btn btn-secondary btn-sm">Logout</a>
    </div>
  </header>

  <!-- Main App 3-Column Layout -->
  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-profile-card glass-panel">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" id="sidebar-user-avatar" class="avatar avatar-lg" />
        <div>
          <h3 id="sidebar-user-name" style="font-size:1.1rem; font-weight:700;">Loading...</h3>
          <p id="sidebar-user-username" style="font-size:0.82rem; color:var(--text-secondary);">@username</p>
        </div>
        <span class="pulse-score-badge" id="sidebar-user-score">⚡ 150 Pulse</span>
      </div>

      <nav class="nav-menu glass-panel" style="padding:12px;">
        <a href="home.html" class="nav-link active">🏠 <span>Smart Feed</span></a>
        <a href="search.html" class="nav-link">🔎 <span>Discover</span></a>
        <a href="community.html" class="nav-link">👥 <span>Communities</span></a>
        <a href="challenge.html" class="nav-link">🏆 <span>Challenges</span></a>
        <a href="activity.html" class="nav-link">🔔 <span>Activity</span> <span class="unread-badge" id="unread-count-badge" style="display:none;">0</span></a>
        <a href="analytics.html" class="nav-link">📊 <span>Creator Analytics</span></a>
        <a href="profile.html" class="nav-link">👤 <span>My Profile</span></a>
      </nav>
    </aside>

    <!-- Center Feed Area -->
    <main class="main-feed-container">
      <!-- Feed Mode Switcher Tabs -->
      <div class="feed-tabs">
        <button class="feed-tab-btn active" data-mode="FOR YOU">FOR YOU</button>
        <button class="feed-tab-btn" data-mode="FOLLOWING">FOLLOWING</button>
        <button class="feed-tab-btn" data-mode="TRENDING">TRENDING</button>
      </div>

      <!-- Post Creation Card -->
      <div class="create-post-card glass-panel">
        <form id="create-post-form">
          <div class="create-post-header">
            <textarea id="post-content-input" class="create-post-input" placeholder="Share an idea, ask a question, or spark a discussion..."></textarea>
          </div>

          <div id="poll-builder-section" class="poll-builder" style="display:none;">
            <input type="text" id="poll-question-input" class="input-field" placeholder="Poll Question: e.g. What framework should we adopt?" />
            <input type="text" id="poll-opt-1" class="input-field" placeholder="Option 1" />
            <input type="text" id="poll-opt-2" class="input-field" placeholder="Option 2" />
            <input type="text" id="poll-opt-3" class="input-field" placeholder="Option 3 (Optional)" />
          </div>

          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; border-top:1px solid var(--border-color); padding-top:12px; margin-top:8px;">
            <div class="post-type-selector">
              <span class="type-pill selected" data-type="text">📝 Text</span>
              <span class="type-pill" data-type="idea">💡 Idea</span>
              <span class="type-pill" data-type="question">❓ Question</span>
              <span class="type-pill" data-type="poll">📊 Poll</span>
              <span class="type-pill" data-type="achievement">🏆 Achievement</span>
            </div>

            <div style="display:flex; align-items:center; gap:10px;">
              <select id="post-mood-select" class="mood-select">
                <option value="">✨ Select Mood</option>
                <option value="Happy">😊 Happy</option>
                <option value="Excited">🚀 Excited</option>
                <option value="Curious">💡 Curious</option>
                <option value="Motivated">🔥 Motivated</option>
                <option value="Calm">😌 Calm</option>
                <option value="Thoughtful">🤔 Thoughtful</option>
              </select>

              <button type="submit" class="btn btn-primary btn-sm">Publish Idea</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Feed Container -->
      <div id="feed-container">
        <div class="skeleton" style="height: 180px; margin-bottom: 16px;"></div>
        <div class="skeleton" style="height: 180px; margin-bottom: 16px;"></div>
      </div>
    </main>

    <!-- Right Sidebar Widgets -->
    <aside class="right-panel">
      <!-- Trending Engine Widget -->
      <div class="widget-card glass-panel">
        <div class="widget-title">
          <span>🔥 Trending Topics</span>
          <a href="search.html" style="font-size:0.8rem; color:var(--primary);">View all</a>
        </div>
        <div id="trending-topics-widget">
          <div class="skeleton" style="height:40px;"></div>
        </div>
      </div>

      <!-- Suggested People Widget -->
      <div class="widget-card glass-panel">
        <div class="widget-title">
          <span>🤝 People You May Know</span>
          <a href="search.html" style="font-size:0.8rem; color:var(--primary);">Explore</a>
        </div>
        <div id="suggested-people-widget">
          <div class="skeleton" style="height:40px;"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Mobile Bottom Navigation Bar (Requirement 29) -->
  <nav class="mobile-bottom-nav">
    <a href="home.html" class="mobile-nav-item active"><span>🏠</span> Home</a>
    <a href="search.html" class="mobile-nav-item"><span>🔎</span> Search</a>
    <a href="home.html#create" class="mobile-nav-item"><span>➕</span> Create</a>
    <a href="activity.html" class="mobile-nav-item"><span>🔔</span> Activity</a>
    <a href="profile.html" class="mobile-nav-item"><span>👤</span> Profile</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
